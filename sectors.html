<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sector Leadership Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <style>
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(circle at top, #1e293b, #0b1022 55%);
        color: #f8fafc;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        border-bottom: 1px solid #334155;
        background: rgba(2, 6, 23, 0.94);
        backdrop-filter: blur(8px);
      }
      .topbar-inner {
        max-width: 1240px;
        margin: 0 auto;
        padding: 8px 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .topbar a {
        color: #bfdbfe;
        text-decoration: none;
        border: 1px solid #334155;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.82rem;
      }
      .topbar a.active {
        border-color: #60a5fa;
        color: #dbeafe;
      }
      .wrap {
        max-width: 1240px;
        margin: 0 auto;
        padding: 18px 14px 28px;
      }
      .panel {
        margin-top: 12px;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid #334155;
        background: rgba(2, 6, 23, 0.82);
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }
      select, button {
        border: 1px solid #475569;
        border-radius: 8px;
        background: #0b1224;
        color: #f8fafc;
        padding: 8px 10px;
      }
      label {
        color: #cbd5e1;
        font-size: 0.84rem;
        margin-bottom: 4px;
        display: block;
      }
      .canvas-wrap {
        border: 1px solid #334155;
        border-radius: 12px;
        background: #071021;
        padding: 8px;
        margin-top: 12px;
        overflow: hidden;
      }
      .chart-host {
        position: relative;
        height: 360px;
      }
      .chart-host canvas {
        position: absolute !important;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      .evidence {
        margin-top: 12px;
        border: 1px solid #334155;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.62);
        padding: 12px;
      }
      .selection-card {
        border: 1px solid #334155;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.72);
        padding: 10px;
        margin-bottom: 10px;
      }
      .selection-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 8px 12px;
      }
      .selection-row {
        font-size: 0.8rem;
        color: #cbd5e1;
      }
      .selection-row strong {
        color: #e2e8f0;
      }
      .evidence-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(280px, 1fr));
        gap: 10px;
      }
      .item {
        border: 1px solid #334155;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.72);
        padding: 10px;
      }
      .item h4 { margin: 0 0 6px; font-size: 0.9rem; }
      .item p { margin: 0; color: #cbd5e1; font-size: 0.8rem; line-height: 1.35; }
      .source-badge {
        display: inline-block;
        margin-bottom: 6px;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 0.7rem;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        border: 1px solid transparent;
      }
      .source-badge.paper {
        background: rgba(56, 189, 248, 0.14);
        border-color: rgba(56, 189, 248, 0.55);
      }
      .source-badge.article {
        background: rgba(167, 139, 250, 0.14);
        border-color: rgba(167, 139, 250, 0.55);
      }
      .hint { color: #cbd5e1; font-size: 0.85rem; margin-top: 8px; }
      @media (max-width: 900px) {
        .controls, .evidence-list, .selection-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a href="./index.html">Macro cycle</a>
        <a class="active" href="./sectors.html">Sectors</a>
        <a href="./combined.html">Combined</a>
      </div>
    </header>
    <main class="wrap">
      <h1>Sector Leadership Dashboard</h1>
      <p class="hint">
        Click any plotted data point to fetch dynamic papers/articles for the selected market leadership regime.
      </p>
      <section class="panel">
        <div class="controls">
          <div>
            <label for="rangePreset">Timeline window</label>
            <select id="rangePreset">
              <option value="all">All history</option>
              <option value="recent" selected>2008-present</option>
              <option value="covid">2018-2022</option>
            </select>
          </div>
          <div>
            <label for="metricMode">Display mode</label>
            <select id="metricMode">
              <option value="relative12" selected>Relative 12m return vs S&P 500</option>
              <option value="relative3">Relative 3m return vs S&P 500</option>
            </select>
          </div>
          <div>
            <label>Actions</label>
            <button id="reloadBtn" type="button">Reload data</button>
          </div>
        </div>
        <div class="canvas-wrap">
          <div class="chart-host"><canvas id="sectorChart"></canvas></div>
        </div>
        <div class="evidence">
          <h3>Clicked point evidence (dynamic)</h3>
          <p class="hint" id="evidenceMeta">Click any line point to fetch ranked references.</p>
          <div class="evidence-list" id="evidenceList"></div>
        </div>
      </section>
    </main>

    <script>
      const metricQueries = {
        NASDAQ100: ["technology sector leadership earnings concentration", "mega cap growth leadership macro cycle"],
        NASDAQCOM: ["broad technology performance and macro conditions", "nasdaq outperformance recession cycle"],
        DJIA: ["defensive large cap rotation during stress", "cyclical defensive sector rotation evidence"],
        NASDAQNQUS500LCE: ["equal weight vs cap weight market breadth", "market breadth deterioration and concentration"],
      };

      function dateObj(v) { return new Date(v + "T00:00:00Z"); }
      function stripHtmlTags(t) { return String(t || "").replace(/<[^>]+>/g, " ").replace(/\s{2,}/g, " ").trim(); }
      function invertOpenAlexAbstract(indexObj) {
        if (!indexObj || typeof indexObj !== "object") return "";
        const pairs = [];
        Object.entries(indexObj).forEach(([tok, pos]) => (pos || []).forEach((p) => pairs.push([p, tok])));
        pairs.sort((a, b) => a[0] - b[0]);
        return pairs.map((x) => x[1]).join(" ");
      }
      function normalizeDoiUrl(v) {
        if (!v) return "";
        if (String(v).startsWith("http://") || String(v).startsWith("https://")) return String(v);
        if (String(v).toLowerCase().startsWith("doi.org/")) return `https://${v}`;
        return `https://doi.org/${v}`;
      }
      function summarize(title, body) {
        const txt = `${title}. ${body}`.replace(/https?:\/\/\S+/g, " ").replace(/\s{2,}/g, " ").trim();
        const parts = txt.split(/(?<=[.!?])\s+/).map((s) => s.trim()).filter(Boolean);
        const out = [];
        for (const p of parts) {
          const words = p.split(/\s+/);
          if (words.length < 6) continue;
          out.push(words.length > 34 ? words.slice(0, 34).join(" ") + "." : p);
          if (out.length >= 3) break;
        }
        return out.length ? out.join(" ") : (title.endsWith(".") ? title : title + ".");
      }
      function monthMentionScore(text, targetDate) {
        const target = new Date(targetDate + "T00:00:00Z");
        const y = target.getUTCFullYear();
        const mIdx = target.getUTCMonth();
        const monthNames = [
          "january","february","march","april","may","june",
          "july","august","september","october","november","december",
        ];
        const shortNames = monthNames.map((x) => x.slice(0, 3));
        const longPattern = new RegExp(`\\b${monthNames[mIdx]}\\s+${y}\\b`, "i");
        const shortPattern = new RegExp(`\\b${shortNames[mIdx]}\\.?\\s+${y}\\b`, "i");
        const ymdPattern = new RegExp(`\\b${y}-${String(mIdx + 1).padStart(2, "0")}\\b`);
        const t = String(text || "");
        return longPattern.test(t) || shortPattern.test(t) || ymdPattern.test(t) ? 1 : 0;
      }
      function relationSignal(text, contextTerms = []) {
        const t = String(text || "").toLowerCase();
        const cueTerms = [
          "because", "due to", "led to", "results in", "caused", "therefore", "as a result",
          "driven by", "triggered by", "pressured by", "contributed to", "linked to",
        ];
        const contextMatches = (contextTerms || [])
          .filter((w) => typeof w === "string" && w.length > 3 && t.includes(w.toLowerCase()))
          .slice(0, 3);
        const cueMatches = cueTerms.filter((w) => t.includes(w)).slice(0, 3);
        const contextHit = contextMatches.length > 0;
        const cueHit = cueMatches.length > 0;
        return { contextHit, cueHit, strong: contextHit && cueHit, contextMatches, cueMatches };
      }
      function splitSentences(text) {
        return String(text || "")
          .replace(/\s{2,}/g, " ")
          .split(/(?<=[.!?])\s+/)
          .map((s) => s.trim())
          .filter((s) => s.length > 0);
      }
      function extractDateReference(text, targetDate) {
        const target = new Date(targetDate + "T00:00:00Z");
        const y = target.getUTCFullYear();
        const mIdx = target.getUTCMonth();
        const monthNames = [
          "january","february","march","april","may","june",
          "july","august","september","october","november","december",
        ];
        const shortNames = monthNames.map((x) => x.slice(0, 3));
        const patterns = [
          new RegExp(`\\b${monthNames[mIdx]}\\s+${y}\\b`, "i"),
          new RegExp(`\\b${shortNames[mIdx]}\\.?\\s+${y}\\b`, "i"),
          new RegExp(`\\b${y}-${String(mIdx + 1).padStart(2, "0")}\\b`),
          new RegExp(`\\b${y}\\b`),
        ];
        const t = String(text || "");
        for (const p of patterns) {
          const m = t.match(p);
          if (m && m[0]) return m[0];
        }
        return "";
      }
      function extractValueReference(text) {
        const t = String(text || "");
        const valuePatterns = [
          /\b\d+(?:\.\d+)?\s?(?:%|percent)\b/i,
          /\b\d+(?:\.\d+)?\s?(?:bps|bp|basis points)\b/i,
          /\b\d+(?:\.\d+)?\b/,
        ];
        for (const p of valuePatterns) {
          const m = t.match(p);
          if (m && m[0]) return m[0];
        }
        return "";
      }
      function extractCausalReference(text, contextTerms) {
        const rel = relationSignal(text, contextTerms);
        const sentences = splitSentences(text);
        const cueTerms = rel.cueMatches?.length
          ? rel.cueMatches
          : ["because", "due to", "led to", "results in", "caused", "therefore", "as a result", "driven by"];
        const metricTokens = (contextTerms || [])
          .map((x) => String(x || "").toLowerCase())
          .filter((x) => x.length > 3);
        const best = sentences.find((s) => {
          const lower = s.toLowerCase();
          return cueTerms.some((t) => lower.includes(t)) && metricTokens.some((t) => lower.includes(t));
        }) || sentences.find((s) => cueTerms.some((t) => s.toLowerCase().includes(t)));
        return best ? (best.split(/\s+/).length > 34 ? best.split(/\s+/).slice(0, 34).join(" ") + "." : best) : "";
      }
      function sentimentSignal(text) {
        const t = String(text || "").toLowerCase();
        const positiveLex = [
          "improve", "improved", "resilient", "recovery", "stabilize", "stabilized", "expansion", "strong", "supportive", "easing",
        ];
        const negativeLex = [
          "stress", "deterioration", "decline", "contraction", "weak", "recession", "tightening", "shock", "volatility", "default", "crisis", "loss",
        ];
        const posHits = positiveLex.reduce((n, w) => n + (t.includes(w) ? 1 : 0), 0);
        const negHits = negativeLex.reduce((n, w) => n + (t.includes(w) ? 1 : 0), 0);
        const total = posHits + negHits;
        const score = total ? (posHits - negHits) / total : 0;
        let label = "neutral";
        if (score > 0.18) label = "positive";
        if (score < -0.18) label = "negative";
        return { label, score };
      }
      function sourceQualitySignal(text, title, url, contextTerms = []) {
        const sourceText = `${title || ""}. ${text || ""}`.toLowerCase();
        const u = String(url || "").toLowerCase();
        const financeTerms = [
          "market", "markets", "equity", "equities", "stock", "stocks", "bond", "bonds",
          "credit", "spread", "yield", "treasury", "macro", "recession", "inflation", "gdp",
          "earnings", "financial", "funding", "liquidity", "risk", "volatility", "unemployment",
          "industrial production", "bank", "banks", "fed", "federal reserve", "sector", "relative return",
        ];
        const spamTerms = [
          "livestream", "live stream", "watch live", "free stream", "vs ", "match",
          "sportsbook", "betting", "highlights", "ticket", "soccer", "football live",
        ];
        const contextMatches = (contextTerms || []).reduce((n, w) => n + (sourceText.includes(String(w).toLowerCase()) ? 1 : 0), 0);
        const financeHitCount = financeTerms.reduce((n, w) => n + (sourceText.includes(w) ? 1 : 0), 0);
        const spamHit = spamTerms.some((w) => sourceText.includes(w) || u.includes(w.replace(/\s+/g, "")));
        const trustedDomainBoost =
          /(openalex\.org|doi\.org|crossref\.org|nber\.org|imf\.org|federalreserve\.gov|bis\.org|oecd\.org|stlouisfed\.org)/i.test(u)
            ? 1
            : 0;
        const financeRelevant = financeHitCount >= 2 || contextMatches >= 2 || trustedDomainBoost === 1;
        const qualityScore = financeHitCount * 1.1 + contextMatches * 1.2 + trustedDomainBoost * 1.4 - (spamHit ? 8 : 0);
        return { financeHitCount, contextMatches, spamHit, trustedDomainBoost, financeRelevant, qualityScore };
      }
      function buildContextTerms(clickCtx) {
        return Array.from(new Set([
          clickCtx.label,
          clickCtx.seriesId,
          clickCtx.modeLabel,
          "sector leadership",
          "market breadth",
          "relative return",
        ].join(" ").toLowerCase().match(/[a-z0-9]+/g) || [])).filter((x) => x.length > 3);
      }
      function extractEvidenceSignals(text, targetDate, contextTerms) {
        const rel = relationSignal(text, contextTerms);
        const sentiment = sentimentSignal(text);
        return {
          monthMatched: monthMentionScore(text, targetDate) === 1,
          relationStrong: rel.strong,
          relationContext: rel.contextHit,
          relationCue: rel.cueHit,
          relationTerms: [...(rel.contextMatches || []), ...(rel.cueMatches || [])].slice(0, 5),
          extractedDate: extractDateReference(text, targetDate),
          extractedValue: extractValueReference(text),
          extractedCausal: extractCausalReference(text, contextTerms),
          sentimentLabel: sentiment.label,
          sentimentScore: sentiment.score,
        };
      }
      function score(text, query, year, targetDate, contextTerms, signals = null) {
        const tset = new Set(String(text).toLowerCase().match(/[a-z0-9]+/g) || []);
        const q = (String(query).toLowerCase().match(/[a-z0-9]+/g) || []).filter((x) => x.length > 2);
        const overlap = q.reduce((n, tok) => n + (tset.has(tok) ? 1 : 0), 0);
        const targetYear = Number(String(targetDate).slice(0, 4));
        let temporal = 0;
        if (Number.isFinite(year)) {
          temporal = Math.max(0, 1 - Math.min(20, Math.abs(year - targetYear)) / 20);
        }
        const s = signals || extractEvidenceSignals(text, targetDate, contextTerms);
        return temporal * 14
          + (s.monthMatched ? 5 : 0)
          + overlap * 1.2
          + (s.relationStrong ? 6 : (s.relationContext || s.relationCue ? 2 : 0))
          + Math.abs(s.sentimentScore || 0) * 1.5
          + (s.extractedCausal ? 1.2 : 0);
      }
      function crossReferenceEvidence(items) {
        const withRefs = items.map((item) => ({ ...item }));
        const signatureMap = new Map();
        withRefs.forEach((item, idx) => {
          const signatures = new Set();
          if (item.extractedDate) signatures.add(`date:${String(item.extractedDate).toLowerCase()}`);
          if (item.extractedValue) signatures.add(`value:${String(item.extractedValue).toLowerCase()}`);
          (item.relationTerms || []).forEach((term) => signatures.add(`term:${String(term).toLowerCase()}`));
          if (item.sentimentLabel && item.sentimentLabel !== "neutral") signatures.add(`sent:${item.sentimentLabel}`);
          item.crossRefSignatures = Array.from(signatures);
          item.crossRefSignatures.forEach((sig) => {
            if (!signatureMap.has(sig)) signatureMap.set(sig, []);
            signatureMap.get(sig).push(idx);
          });
        });
        withRefs.forEach((item, idx) => {
          const peers = new Set();
          const support = [];
          item.crossRefSignatures.forEach((sig) => {
            const hits = signatureMap.get(sig) || [];
            if (hits.length > 1) support.push(`${sig.replace(/^[^:]+:/, "")} (${hits.length})`);
            hits.forEach((peerIdx) => { if (peerIdx !== idx) peers.add(peerIdx); });
          });
          item.crossRefCount = peers.size;
          item.crossRefStrength = withRefs.length > 1 ? peers.size / (withRefs.length - 1) : 0;
          item.crossRefSupport = support.slice(0, 3);
        });
        const sentimentBreakdown = { positive: 0, neutral: 0, negative: 0 };
        withRefs.forEach((item) => {
          sentimentBreakdown[item.sentimentLabel] = (sentimentBreakdown[item.sentimentLabel] || 0) + 1;
        });
        const dominantSentiment = Object.entries(sentimentBreakdown).sort((a, b) => b[1] - a[1])[0]?.[0] || "neutral";
        const crossReferencedCount = withRefs.filter((x) => x.crossRefCount > 0).length;
        return {
          items: withRefs,
          summary: {
            dominantSentiment,
            sentimentBreakdown,
            crossReferencedCount,
            coverageRatio: withRefs.length ? crossReferencedCount / withRefs.length : 0,
          },
        };
      }
      async function fetchOpenAlex(query) {
        const url = "https://api.openalex.org/works?search=" + encodeURIComponent(query) + "&per-page=24&select=display_name,publication_year,doi,id,abstract_inverted_index";
        try { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) return []; return (await r.json()).results || []; } catch { return []; }
      }
      async function fetchCrossref(query) {
        const url = "https://api.crossref.org/works?query=" + encodeURIComponent(query) + "&rows=24";
        try { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) return []; return (await r.json())?.message?.items || []; } catch { return []; }
      }

      let payloadCache = null;
      let chart = null;

      async function loadData() {
        const res = await fetch("./data/sector_data.json?ts=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("Failed loading sector_data.json");
        return res.json();
      }

      function filterTimeline(rows, preset) {
        if (preset === "all") return rows;
        const windows = { recent: ["2008-01-01", "2100-01-01"], covid: ["2018-01-01", "2022-12-01"] };
        const [s, e] = windows[preset] || windows.recent;
        return rows.filter((r) => r.date >= s && r.date <= e);
      }

      function buildDatasets(rows, metricKey) {
        const seriesIds = ["NASDAQ100", "NASDAQCOM", "DJIA", "NASDAQNQUS500LCE"];
        const colors = { NASDAQ100: "#22d3ee", NASDAQCOM: "#2dd4bf", DJIA: "#facc15", NASDAQNQUS500LCE: "#f472b6" };
        return seriesIds.map((sid) => ({
          label: rows.find((r) => r.sectors?.[sid])?.sectors?.[sid]?.label || sid,
          seriesId: sid,
          borderColor: colors[sid],
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.15,
          data: rows
            .map((r) => ({ x: dateObj(r.date), y: r.sectors?.[sid]?.[metricKey] ?? null, date: r.date }))
            .filter((p) => Number.isFinite(p.y)),
        }));
      }

      async function renderEvidence(clickCtx) {
        const meta = document.getElementById("evidenceMeta");
        const list = document.getElementById("evidenceList");
        list.innerHTML = "";
        const targetYear = Number.parseInt(String(clickCtx.date).slice(0, 4), 10);
        const yearFloor = Math.max(1900, targetYear - 2);
        const yearCeil = targetYear + 1;
        const isoMonth = String(clickCtx.date || "").slice(0, 7);
        const baseQueries = metricQueries[clickCtx.seriesId] || ["market leadership macro cycle"];
        const targeted = [
          `${clickCtx.label} ${isoMonth} relative performance`,
          `${clickCtx.label} sector leadership ${isoMonth} cause effect`,
          `${clickCtx.modeLabel} ${clickCtx.value.toFixed(3)} ${isoMonth}`,
        ];
        const qDedup = new Set();
        const queries = [...baseQueries, ...targeted]
          .map((q) => `${q} ${clickCtx.date} value ${clickCtx.value.toFixed(3)}`.trim())
          .filter((q) => {
            const k = q.toLowerCase();
            if (qDedup.has(k)) return false;
            qDedup.add(k);
            return true;
          })
          .slice(0, 6);
        const contextTerms = buildContextTerms(clickCtx);
        meta.textContent = `Searching live references for ${clickCtx.label} on ${clickCtx.date}...`;

        const items = [];
        for (const q of queries) {
          const [oa, cr] = await Promise.all([fetchOpenAlex(q), fetchCrossref(q)]);
          oa.forEach((rec) => {
            const title = String(rec.display_name || "").trim();
            const year = Number.isFinite(rec.publication_year) ? rec.publication_year : null;
            if (Number.isFinite(year) && (year < yearFloor || year > yearCeil)) return;
            const url = normalizeDoiUrl(rec.doi) || String(rec.id || "");
            if (!title || !url) return;
            const abs = invertOpenAlexAbstract(rec.abstract_inverted_index);
            const txt = `${title}. ${abs}`;
            const quality = sourceQualitySignal(txt, title, url, contextTerms);
            if (quality.spamHit || !quality.financeRelevant) return;
            const signals = extractEvidenceSignals(txt, clickCtx.date, contextTerms);
            items.push({
              sourceType: "paper",
              title,
              year,
              url,
              sourceQualityScore: quality.qualityScore,
              ...signals,
              score: score(txt, q, year, clickCtx.date, contextTerms, signals) + quality.qualityScore,
              summary: summarize(title, abs),
            });
          });
          cr.forEach((rec) => {
            const title = String((rec.title || [])[0] || "").trim();
            const issued = rec?.issued?.["date-parts"] || [];
            const year = issued[0] && Number.isFinite(issued[0][0]) ? issued[0][0] : null;
            if (Number.isFinite(year) && (year < yearFloor || year > yearCeil)) return;
            const url = String(rec.URL || "").trim();
            if (!title || !url) return;
            const c = String((rec["container-title"] || [])[0] || "").trim();
            const abs = stripHtmlTags(rec.abstract || "");
            const txt = `${title}. ${c}. ${abs}`;
            const quality = sourceQualitySignal(txt, title, url, contextTerms);
            if (quality.spamHit || !quality.financeRelevant) return;
            const signals = extractEvidenceSignals(txt, clickCtx.date, contextTerms);
            items.push({
              sourceType: "article",
              title,
              year,
              url,
              sourceQualityScore: quality.qualityScore,
              ...signals,
              score: score(txt, q, year, clickCtx.date, contextTerms, signals) + quality.qualityScore,
              summary: summarize(title, `${c}. ${abs}`),
            });
          });
        }

        const dedup = new Map();
        items.forEach((x) => {
          const k = (x.url || x.title).toLowerCase();
          if (!dedup.has(k) || x.score > dedup.get(k).score) dedup.set(k, x);
        });
        const ranked = Array.from(dedup.values())
          .filter((x) => (x.monthMatched || Number.isFinite(x.year)) && !x.spamHit)
          .sort((a, b) => b.score - a.score);
        const crossRef = crossReferenceEvidence(ranked);
        const all = crossRef.items.sort((a, b) => (b.score + b.crossRefStrength * 4) - (a.score + a.crossRefStrength * 4));
        const prior = all.filter((x) => Number.isFinite(x.year) && x.year < targetYear).slice(0, 5);
        const currentRaw = all.filter((x) => Number.isFinite(x.year) && x.year === targetYear);
        const currentStrict = currentRaw.filter((x) => x.monthMatched || x.extractedDate || x.relationStrong || x.extractedCausal);
        const current = (currentStrict.length ? currentStrict : currentRaw).slice(0, 5);
        const future = all.filter((x) => Number.isFinite(x.year) && x.year > targetYear).slice(0, 5);
        meta.innerHTML = `
          <div class="selection-card">
            <div class="selection-grid">
              <div class="selection-row"><strong>Selected line:</strong> ${clickCtx.label}</div>
              <div class="selection-row"><strong>Date:</strong> ${clickCtx.date}</div>
              <div class="selection-row"><strong>Metric:</strong> ${clickCtx.modeLabel}</div>
              <div class="selection-row"><strong>Value:</strong> ${clickCtx.value.toFixed(3)}%</div>
              <div class="selection-row"><strong>Publication window:</strong> ${yearFloor} to ${yearCeil}</div>
              <div class="selection-row"><strong>Live queries:</strong> ${queries.length}</div>
              <div class="selection-row"><strong>Candidates analyzed:</strong> ${items.length} raw / ${all.length} deduped</div>
              <div class="selection-row"><strong>Month-specific references:</strong> ${all.filter((x) => x.monthMatched).length}</div>
              <div class="selection-row"><strong>Cross-referenced items:</strong> ${crossRef.summary.crossReferencedCount} (${(crossRef.summary.coverageRatio * 100).toFixed(0)}%)</div>
              <div class="selection-row"><strong>Sentiment model:</strong> ${crossRef.summary.dominantSentiment} (${crossRef.summary.sentimentBreakdown.positive} pos / ${crossRef.summary.sentimentBreakdown.neutral} neut / ${crossRef.summary.sentimentBreakdown.negative} neg)</div>
            </div>
          </div>
        `;
        if (!all.length) {
          list.innerHTML = `<article class="item"><p>No live evidence results found for this clicked context.</p></article>`;
          return;
        }

        [
          ["Prior observation", prior],
          ["Current information (as of point)", current],
          ["Future analysis", future],
        ].forEach(([label, rows]) => {
          const head = document.createElement("article");
          head.className = "item";
          head.innerHTML = `<h4>${label}</h4><p>${rows.length} references</p>`;
          list.appendChild(head);
          rows.forEach((x) => {
            const el = document.createElement("article");
            el.className = "item";
            const y = x.year ? ` (${x.year})` : "";
            const sourceType = (x.sourceType || "article").toLowerCase();
            el.innerHTML = `
              <span class="source-badge ${sourceType}">${sourceType}</span>
              <h4><a class="req-link" href="${x.url}" target="_blank" rel="noopener noreferrer">${x.title}</a>${y}</h4>
              <p><strong>Rank score:</strong> ${Number(x.score).toFixed(2)} | <strong>Month match:</strong> ${x.monthMatched ? "yes" : "no"} | <strong>Cause/effect extraction:</strong> ${x.relationStrong ? "strong" : (x.relationContext || x.relationCue ? "partial" : "weak")}</p>
              <p><strong>Extracted date/value:</strong> ${x.extractedDate || "n/a"} / ${x.extractedValue || "n/a"}</p>
              <p><strong>Cross-reference support:</strong> ${x.crossRefCount || 0} corroborating refs${x.crossRefSupport?.length ? ` (${x.crossRefSupport.join(", ")})` : ""}</p>
              <p><strong>Sentiment:</strong> ${x.sentimentLabel || "neutral"} (${Number(x.sentimentScore || 0).toFixed(2)})</p>
              <p><strong>Extracted causal text:</strong> ${x.extractedCausal || "No explicit causal sentence extracted."}</p>
              <p>${x.summary}</p>
            `;
            list.appendChild(el);
          });
        });
      }

      function render() {
        const preset = document.getElementById("rangePreset").value;
        const mode = document.getElementById("metricMode").value;
        const modeLabel = mode === "relative12" ? "Relative 12m return vs S&P 500" : "Relative 3m return vs S&P 500";
        const metricKey = mode === "relative12" ? "relative12mPct" : "relative3mPct";
        const rows = filterTimeline(payloadCache.timeline || [], preset);
        const datasets = buildDatasets(rows, metricKey);
        if (chart) chart.destroy();
        chart = new Chart(document.getElementById("sectorChart"), {
          type: "line",
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "nearest", intersect: true },
            scales: {
              x: { type: "time", ticks: { color: "#dbeafe" }, grid: { color: "rgba(148,163,184,0.12)" } },
              y: { ticks: { color: "#dbeafe" }, grid: { color: "rgba(148,163,184,0.12)" }, title: { display: true, text: modeLabel, color: "#bfdbfe" } },
            },
            plugins: {
              legend: { labels: { color: "#e2e8f0" } },
              tooltip: {
                callbacks: {
                  label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(3)}%`,
                },
              },
            },
          },
        });
        chart.canvas.onclick = async (evt) => {
          const pts = chart.getElementsAtEventForMode(evt, "nearest", { intersect: true }, true);
          if (!pts.length) return;
          const p = pts[0];
          const ds = chart.data.datasets[p.datasetIndex];
          const dp = ds.data[p.index];
          await renderEvidence({
            seriesId: ds.seriesId,
            label: ds.label,
            date: dp.date,
            value: dp.y,
            modeLabel,
          });
        };
      }

      async function init() {
        payloadCache = await loadData();
        render();
        document.getElementById("rangePreset").addEventListener("change", render);
        document.getElementById("metricMode").addEventListener("change", render);
        document.getElementById("reloadBtn").addEventListener("click", async () => {
          payloadCache = await loadData();
          render();
        });
      }
      init().catch((err) => {
        document.getElementById("evidenceMeta").textContent = `Failed to initialize: ${err.message}`;
      });
    </script>
  </body>
</html>
