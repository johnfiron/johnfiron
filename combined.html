<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Macro + Sector Combined View</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <style>
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #070e1f;
        color: #f8fafc;
      }
      .wrap {
        max-width: 1240px;
        margin: 0 auto;
        padding: 18px 16px 28px;
      }
      h1 {
        margin: 0;
        font-size: 1.65rem;
      }
      .sub {
        margin: 6px 0 0;
        color: #cbd5e1;
        font-size: 0.94rem;
      }
      .panel {
        margin-top: 14px;
        border: 1px solid #334155;
        border-radius: 12px;
        background: #0b1328;
        padding: 12px;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }
      .control {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      label {
        color: #cbd5e1;
        font-size: 0.82rem;
        font-weight: 700;
      }
      select, button {
        border: 1px solid #475569;
        border-radius: 8px;
        background: #0f172a;
        color: #f8fafc;
        padding: 8px 10px;
      }
      .grid {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }
      .canvas-wrap {
        border: 1px solid #334155;
        border-radius: 12px;
        background: #071021;
        padding: 8px;
      }
      canvas {
        width: 100%;
        height: 360px;
      }
      .insight {
        margin-top: 10px;
        border: 1px solid #334155;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.55);
        padding: 10px;
      }
      .insight p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.35;
        font-size: 0.86rem;
      }
      .links {
        margin-top: 12px;
        display: flex;
        gap: 10px;
      }
      .links a {
        color: #93c5fd;
        text-decoration: none;
      }
      .links a:hover {
        text-decoration: underline;
      }
      @media (max-width: 900px) {
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Combined View: Macro Cycle + Sector Leadership</h1>
      <p class="sub">
        Joint timeline linking phase/stress state with sector-proxy relative leadership. Click points to read combined context.
      </p>
      <section class="panel">
        <div class="controls">
          <div class="control">
            <label for="sectorSelect">Sector proxy</label>
            <select id="sectorSelect"></select>
          </div>
          <div class="control">
            <label for="rangePreset">Range</label>
            <select id="rangePreset">
              <option value="all">All history</option>
              <option value="gfc">GFC focus (2005-2012)</option>
              <option value="covid">COVID focus (2018-2022)</option>
              <option value="recent" selected>Recent (2016-present)</option>
            </select>
          </div>
          <div class="control">
            <label>Actions</label>
            <button id="refreshBtn" type="button">Reload</button>
          </div>
        </div>

        <div class="grid">
          <div class="canvas-wrap"><canvas id="macroSectorChart"></canvas></div>
          <div class="canvas-wrap"><canvas id="phaseChart"></canvas></div>
        </div>
        <div class="insight"><p id="insightText">Click a point to inspect combined state.</p></div>
      </section>
      <div class="links">
        <a href="./index.html">Main dashboard</a>
        <a href="./sectors.html">Sector page</a>
      </div>
    </main>

    <script>
      function dateObj(v) {
        return new Date(v + "T00:00:00Z");
      }

      function filterRange(data, preset) {
        if (preset === "all") return data;
        const windows = {
          gfc: ["2005-01-01", "2012-12-01"],
          covid: ["2018-01-01", "2022-12-01"],
          recent: ["2016-01-01", "2100-01-01"],
        };
        const [s, e] = windows[preset];
        return data.filter((d) => d.date >= s && d.date <= e);
      }

      async function loadCombinedData() {
        const res = await fetch("./data/combined_data.json?ts=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error(`Failed to load combined_data.json: ${res.status}`);
        return res.json();
      }

      let chart1;
      let chart2;
      let payloadCache = null;

      function destroyCharts() {
        if (chart1) chart1.destroy();
        if (chart2) chart2.destroy();
      }

      function build(payload) {
        const select = document.getElementById("sectorSelect");
        const range = document.getElementById("rangePreset").value;
        const timeline = filterRange(payload.timeline, range);
        if (!timeline.length) return;
        const sid = select.value || Object.keys(payload.meta.sectorSeries)[0];

        const rel12 = timeline
          .map((r) => ({ x: dateObj(r.date), y: r.sectors?.[sid]?.relative12mPct }))
          .filter((p) => Number.isFinite(p.y));
        const stress = timeline.map((r) => ({ x: dateObj(r.date), y: r.stressScore }));
        const phase = timeline.map((r) => ({ x: dateObj(r.date), y: r.phase }));

        destroyCharts();

        chart1 = new Chart(document.getElementById("macroSectorChart"), {
          type: "line",
          data: {
            datasets: [
              {
                label: `${payload.meta.sectorSeries[sid]} relative 12m vs S&P`,
                data: rel12,
                borderColor: "#60a5fa",
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.12,
                yAxisID: "yRel",
              },
              {
                label: "Stress score",
                data: stress,
                borderColor: "#fb7185",
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.15,
                yAxisID: "yStress",
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            scales: {
              x: { type: "time", ticks: { color: "#dbeafe" }, grid: { color: "rgba(148,163,184,0.15)" } },
              yRel: {
                position: "left",
                ticks: { color: "#bfdbfe" },
                title: { display: true, text: "Relative 12m return pct", color: "#bfdbfe" },
                grid: { color: "rgba(148,163,184,0.15)" },
              },
              yStress: {
                position: "right",
                min: 0,
                max: 1,
                ticks: { color: "#fecaca" },
                title: { display: true, text: "Stress score", color: "#fecaca" },
                grid: { drawOnChartArea: false },
              },
            },
            plugins: { legend: { labels: { color: "#e2e8f0" } } },
          },
        });

        chart2 = new Chart(document.getElementById("phaseChart"), {
          type: "line",
          data: {
            datasets: [
              {
                label: "Phase (1-4)",
                data: phase.map((p) => ({ x: p.x, y: p.y })),
                borderColor: "#22d3ee",
                borderWidth: 2.2,
                pointRadius: 0,
                tension: 0.1,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "nearest", intersect: true },
            scales: {
              x: { type: "time", ticks: { color: "#dbeafe" }, grid: { color: "rgba(148,163,184,0.15)" } },
              y: {
                min: 1,
                max: 4,
                ticks: { color: "#dbeafe", stepSize: 1 },
                title: { display: true, text: "Phase", color: "#bfdbfe" },
                grid: { color: "rgba(148,163,184,0.15)" },
              },
            },
            plugins: { legend: { labels: { color: "#e2e8f0" } } },
          },
        });

        chart1.canvas.onclick = (evt) => {
          const pts = chart1.getElementsAtEventForMode(evt, "nearest", { intersect: true }, true);
          if (!pts.length) return;
          const p = pts[0];
          const d = timeline[p.index];
          if (!d) return;
          const sec = d.sectors?.[sid];
          document.getElementById("insightText").textContent =
            `Date ${d.date}: phase ${d.phase} (${d.phaseName}), stress ${Number(d.stressScore).toFixed(3)}. ` +
            `${payload.meta.sectorSeries[sid]} relative 12m vs S&P: ${
              sec?.relative12mPct != null ? sec.relative12mPct.toFixed(2) + "%" : "n/a"
            }.`;
        };
      }

      async function init() {
        const payload = await loadCombinedData();
        payloadCache = payload;
        const select = document.getElementById("sectorSelect");
        select.innerHTML = Object.entries(payload.meta.sectorSeries)
          .map(([sid, label]) => `<option value="${sid}">${label}</option>`)
          .join("");
        build(payload);
        select.addEventListener("change", () => build(payloadCache));
        document.getElementById("rangePreset").addEventListener("change", () => build(payloadCache));
        document.getElementById("refreshBtn").addEventListener("click", async () => {
          payloadCache = await loadCombinedData();
          build(payloadCache);
        });
      }

      init().catch((err) => {
        const el = document.getElementById("insightText");
        el.textContent = `Failed to initialize combined page: ${err.message}`;
      });
    </script>
  </body>
</html>
